[project]
name = "miseventos-backend"
version = "0.1.0"
description = "API de Mis Eventos: eventos, sesiones, ponentes e inscripciones"
authors = [{ name = "Daniel Mendieta" }]
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (>=0.143.0,<0.144.0)", "sqlmodel (>=0.0.48,<0.0.49)", "alembic (>=1.20.0,<2.0.0)", "psycopg[binary] (>=3.3.6,<4.0.0)", "pydantic-settings (>=2.15.0,<3.0.0)", "argon2-cffi (>=25.1.0,<26.0.0)", "pyjwt (>=2.15.1,<3.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Las excepciones de dominio se llaman como el error que nombran: NotFound, Conflict, Forbidden.
"app/core/excepciones.py" = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostgreSQL real"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.0,<0.18.0)"
]
